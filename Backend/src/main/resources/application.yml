server:
  port: 8080
  servlet:
    context-path: /api

spring:
  config:
    import: "application-local.yml"

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  security:
    oauth2:
      client:
        registration:
          github:
            clientId: ${GITHUB_CLIENT_ID}
            clientSecret: ${GITHUB_CLIENT_SECRET}
          google:
            clientId: ${GOOGLE_CLIENT_ID}
            clientSecret: ${GOOGLE_CLIENT_SECRET}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    url: ${DATASOURCE_URL}
    user: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    change-log: classpath:/db/migration/db.changelog-master.yml

app:
  jwt:
    secret: ${JWT_SECRET}
  oauth2:
    redirectUri: ${FRONTEND_BASE_URL}/oauth2/redirect
  admin:
    email: ${ADMIN_EMAIL}