services:

  database:
    container_name: database
    image: postgres:16.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: quizapp
      POSTGRES_USER: quizuser
      POSTGRES_PASSWORD: quizapp
    ports:
      - "5432:5432"
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: "pg_isready -U quizapp"
